import org.apache.tools.ant.filters.ReplaceTokens
import org.mtr.core.Generator
import org.mtr.core.WebserverSetup
import org.mtr.mod.BuildTools

plugins {
	id "fabric-loom" version "1.10-SNAPSHOT"
}

final BuildTools buildTools = new BuildTools(minecraftVersion, "fabric", project)

// Dev-only perf bench mod (src/perfbench): never part of the release jar. `./gradlew :fabric:runPerfbench` boots into
// fabric/run/perf/saves/ATU Test (a copy of ATU's bench folder: NS pack, Iris, Complementary) and writes perfbench.txt there.
sourceSets {
	perfbench {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
	ataTest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	accessWidenerPath = file("src/main/resources/mtr.accesswidener")
	runConfigs.configureEach { ideConfigGenerated = true }
	mixin { setDefaultRefmapName("mtr.refmap.json") }
	mods {
		mtr { sourceSet sourceSets.main }
		atr_perfbench { sourceSet sourceSets.perfbench }
	}
	runs {
		perfbench {
			client()
			name = "ATR perf bench"
			source sourceSets.perfbench
			runDir = "run/perf"
			// -Patr.world names another save in run/perf/saves
			programArgs "--quickPlaySingleplayer", (project.findProperty("atr.world") ?: "ATU Test").toString()
			vmArg "-Dsodium.checks.issue2561=false"
		}
	}
}

// ATA's headless in-game tests (./gradlew :fabric:runGameTest): the gametest source set (src/gametest) is never part of the release jar
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "aurelia_transit_architecture_gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// MTR keeps its stations in the game test world, so each run starts from a fresh one
tasks.named("runGameTest") {
	doFirst { delete layout.buildDirectory.dir("run/gameTest/world") }
}

configurations {
	// Upstream MTR 4.0.5, never on a classpath: only read by DropInSignaturesTest
	mtrBaseline { transitive = false }
}

dependencies {
	mtrBaseline "maven.modrinth:minecraft-transit-railway:FABRIC-4.0.5+1.20.1"
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings "net.fabricmc:yarn:${buildTools.getYarnVersion()}:v2"
	modImplementation "net.fabricmc:fabric-loader:${buildTools.getFabricVersion()}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${buildTools.getFabricApiVersion()}"
	modApi("com.terraformersmc:modmenu:${buildTools.getModMenuVersion()}") { exclude group: "net.fabricmc", module: "fabric-loader" }
	shadowImplementation "org.mtr:Minecraft-Mappings-fabric-${minecraftVersion}:0.0.1-dev"
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.+"
	testImplementation "org.junit.platform:junit-platform-launcher:1.+"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.+"
	// ATA's unit tests (src/ataTest) create blocks, so they run inside Fabric Loader. Kept out of ATR's own tests: inside the
	// loader, a classpath lookup of /fabric.mod.json finds another mod's file first
	ataTestImplementation "org.junit.jupiter:junit-jupiter-api:5.+"
	ataTestImplementation "org.junit.jupiter:junit-jupiter-params:5.+"
	ataTestRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.+"
	ataTestRuntimeOnly "org.junit.platform:junit-platform-launcher:1.+"
	ataTestImplementation "net.fabricmc:fabric-loader-junit:${buildTools.getFabricVersion()}"

	if (buildTools.hasJadeSupport()) {
		modCompileOnly "maven.modrinth:jade:${buildTools.getJadeVersion()}"
	}

	if (buildTools.hasWthitSupport()) {
		modCompileOnly "mcp.mobius.waila:wthit-api:${buildTools.getWthitVersion()}"
	}
}

repositories {
	maven { url = "https://maven.terraformersmc.com/" }
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
	}
	withSourcesJar()
	withJavadocJar()
}

tasks.register("setupWebsiteFiles") {
//	copy {
//		outputs.upToDateWhen { false }
//		from zipTree("../libs/Transport-Simulation-Core-Build-Tools.jar")
//		into "../buildSrc/src/main/resources"
//		include "website/*.json", "website/src/styles.css", "website/src/theme.scss"
//	}

	Generator.generateTypeScript(project, "schema/resource", "../website/src/app/entity/generated")
}

tasks.register("setupFiles") {
	copy {
		outputs.upToDateWhen { false }
		from "src/main/KeysTemplate.java"
		into "src/main/java/org/mtr/mod"
		filter(ReplaceTokens, tokens: ["version": version, "server": testServer, "debug": debug])
		rename "(.+)Template.java", "\$1.java"
	}

	copy {
		outputs.upToDateWhen { false }
		from "src/main/fabric.mod.template.json"
		into "src/main/resources"
		filter(ReplaceTokens, tokens: ["minecraft": minecraftVersion, "version": version])
		rename "(.+).template.json", "\$1.json"
	}

	if (buildTools.hasJadeSupport()) {
		copy {
			outputs.upToDateWhen { false }
			from "src/main/JadeConfigTemplate.java"
			into "src/main/java/org/mtr/init"
			rename "(.+)Template.java", "\$1.java"
		}
	} else {
		delete fileTree("src/main/java/org/mtr/init/JadeConfig.java")
	}

	if (buildTools.hasWthitSupport()) {
		copy {
			outputs.upToDateWhen { false }
			from "src/main/WthitConfigTemplate.java"
			into "src/main/java/org/mtr/init"
			rename "(.+)Template.java", "\$1.java"
		}

		copy {
			outputs.upToDateWhen { false }
			from "src/main/wthit_plugins_template.json"
			into "src/main/resources"
			rename "(.+)_template.json", "\$1.json"
		}
	} else {
		delete fileTree("src/main/java/org/mtr/init/WthitConfig.java")
		delete fileTree("src/main/resources/wthit_plugins.json")
	}

	buildTools.downloadTranslations(crowdinApiKey, geminiApiKey)
	buildTools.generateTranslations()
	buildTools.copyLootTables("mtr")
	buildTools.copyLootTables("mtrsteamloco")
	buildTools.copyFontDefinition()
	buildTools.copyVehicleTemplates()
	buildTools.getPatreonList(patreonApiKey)
	Generator.generateJava(project, "schema/config", "mod/generated/config", false, "mod.config")
	Generator.generateJava(project, "schema/resource", "mod/generated/resource", false, "core.data", "mod.resource")
	Generator.generateJava(project, "schema/legacy", "legacy/generated/resource", false)
	WebserverSetup.setup(project.rootDir, "fabric/", "mod")
}

build {
	doLast {
		buildTools.copyBuildFile(excludeAssets == "true")
	}
}

shadowJar {
	exclude excludeAssets == "true" ? "assets" : "abc123"
}

remapJar {
	dependsOn(shadowJar)
	mustRunAfter(shadowJar)
	inputFile = file(shadowJar.archivePath)
}

test {
	useJUnitPlatform()
	testLogging { showStandardStreams = true }
	// DropInSignaturesTest compares ATR's classes with the real MTR 4.0.5 jar that add-ons were built against
	inputs.files(configurations.mtrBaseline)
	doFirst { systemProperty "atr.mtrBaselineJar", configurations.mtrBaseline.singleFile.absolutePath }
}

// ATA's unit tests; `check` runs them with ATR's own
tasks.register("ataTest", Test) {
	description = "Runs Aurelia Transit Architecture's unit tests inside Fabric Loader."
	group = "verification"
	testClassesDirs = sourceSets.ataTest.output.classesDirs
	classpath = sourceSets.ataTest.runtimeClasspath
	useJUnitPlatform()
	// The test classes share no files or ports; fabric-loader-junit creates mods/ as each JVM starts
	maxParallelForks = System.getenv("CI") ? Runtime.runtime.availableProcessors() : Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
	doFirst { mkdir("mods") }
	// CI runs the slowest classes in jobs of their own: -Pata.tests.exclude takes comma-separated class patterns
	if (project.hasProperty("ata.tests.exclude")) {
		filter {
			project.property("ata.tests.exclude").toString().split(",").each { excludeTestsMatching it.trim() }
		}
	}
}

// Fabric 1.20.1 runs every registered game test and has no filter, so CI splits the suite over jobs by which test classes the
// gametest mod registers: -Pata.gametests=A,B keeps only those simple class names, -Pata.gametests=!A,B keeps all but those.
// A name that is not registered fails the build, so a rename cannot quietly drop tests from CI.
tasks.named("processGametestResources") {
	final String chosen = project.findProperty("ata.gametests") ?: ""
	inputs.property("ata.gametests", chosen)
	doLast {
		if (!chosen.isEmpty()) {
			final File json = new File(destinationDir, "fabric.mod.json")
			final def mod = new groovy.json.JsonSlurper().parse(json)
			final boolean skip = chosen.startsWith("!")
			final Set<String> names = (skip ? chosen.substring(1) : chosen).split(",").collect { it.trim() } as Set
			final List<String> all = mod.entrypoints["fabric-gametest"]
			final Set<String> known = all.collect { it.substring(it.lastIndexOf('.') + 1) } as Set
			if (!known.containsAll(names)) {
				throw new GradleException("ata.gametests names unknown game test classes: " + (names - known))
			}
			mod.entrypoints["fabric-gametest"] = all.findAll { names.contains(it.substring(it.lastIndexOf('.') + 1)) != skip }
			json.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mod))
		}
	}
}
tasks.named("check") { dependsOn("ataTest") }
