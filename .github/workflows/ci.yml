name: CI
on:
  push:
    branches: [master]
  pull_request:
# ATA's four slowest unit test classes: ata-slow-unit runs them, ata-unit leaves them out
env:
  SLOW_UNIT_TESTS: '*StationPlannerTest,*RealCitiesATest,*CityLandmarksTest,*StationAuditTest'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The suites are split over jobs that run side by side, so the run takes as long as the slowest job: ATR's build and tests,
# ATA's unit tests in 4 shards, ATA's four slowest unit test classes one per job, and ATA's game tests in 3 servers (the airport rebuild test
# and the plane-leaves-a-gate test, each real-time MTR waits over 3 minutes, alone in one each; everything else in the third).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      # Loom's Minecraft download and remap takes ~18 min cold; cache it on every run
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # Pull requests: compile and ATR's unit tests (Fabric 1.20.1); ATA's suites run in the jobs below
      - name: Compile and unit tests
        if: github.event_name == 'pull_request'
        run: ./gradlew setupFiles :fabric:test -x runGameTest
      # master: the full jar build
      - name: Build the jar
        if: github.event_name == 'push'
        run: ./gradlew setupFiles build -x runGameTest -x ataTest
      - name: Keep the jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ATR-fabric-1.20.1
          path: build/release/*.jar
          retention-days: 7
  # ATA's unit tests over 4 jobs, balanced by each class's time on CI (-Pata.tests.shard, fabric/build.gradle,
  # fabric/ata-test-times.properties)
  ata-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ATA unit tests, shard ${{ matrix.shard }}
        run: ./gradlew setupFiles :fabric:ataTest -Pata.tests.exclude="$SLOW_UNIT_TESTS" -Pata.tests.shard=${{ matrix.shard }}
      # Per-class times, for rebalancing the shards (tools/ci/ata_test_times.py)
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ata-unit-results-${{ strategy.job-index }}
          path: fabric/build/test-results/ataTest/*.xml
          retention-days: 7
          if-no-files-found: ignore
  # The four slowest ATA unit test classes, one job each (StationAuditTest's plan sweep alone takes 150 s)
  ata-slow-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        class: ['*StationPlannerTest', '*RealCitiesATest', '*CityLandmarksTest', '*StationAuditTest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ${{ matrix.class }}
        run: ./gradlew setupFiles :fabric:ataTest --tests '${{ matrix.class }}'
  ata-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # simple class names for -Pata.gametests (fabric/build.gradle); "!" keeps every class but those, so new classes land there
        classes: ['AirportMtrRebuildGameTests', 'AirportMtrGameTests', '!AirportMtrRebuildGameTests,AirportMtrGameTests']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Game tests ${{ matrix.classes }}
        run: ./gradlew setupFiles :fabric:runGameTest '-Pata.gametests=${{ matrix.classes }}' --stacktrace
