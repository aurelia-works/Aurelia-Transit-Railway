name: CI
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      # Loom's Minecraft download and remap takes ~18 min cold; cache it on every run
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # Pull requests: compile and unit tests only (Fabric 1.20.1)
      - name: Compile and unit tests
        if: github.event_name == 'pull_request'
        run: ./gradlew setupFiles :fabric:test
      # master: the full jar build
      - name: Build the jar
        if: github.event_name == 'push'
        run: ./gradlew setupFiles build
      - name: Keep the jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ATR-fabric-1.20.1
          path: build/release/*.jar
          retention-days: 7
