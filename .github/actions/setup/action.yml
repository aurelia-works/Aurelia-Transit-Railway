name: Setup
description: Java 21 (Zulu) and Gradle with its cache, the same in every CI job
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 21
    # Every job saves its own Gradle cache on master and only reads it elsewhere. setup-gradle restores a job's own last entry
    # first, so a job that never saves keeps restoring a stale one (and fetches newer dependencies cold from Maven Central).
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
