# BlueMap's own web server: serves *.gz with Content-Encoding and answers a missing tile with 204
enabled: true
webroot: "web"
ip: "127.0.0.1"
port: @PORT@
sse-enabled: true
additional-headers: {
  "Cache-Control": "no-cache"
}
log: {
  file: "data/logs/webserver.log"
  append: false
  format: "%1$s \"%3$s %4$s %5$s\" %6$s %7$s"
}
