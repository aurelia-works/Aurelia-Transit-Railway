# AureliaMap core config (template; aureliamap.sh copies it to run/config)
accept-download: true
data: "data"
# one render thread: the renderer must never compete with the game server
render-thread-count: 1
update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5
# read models and textures from the mod jars in --mods (aureliamap.sh -n)
scan-for-mod-resources: true
metrics: false
log: {
  file: "data/logs/debug.log"
  append: false
}
